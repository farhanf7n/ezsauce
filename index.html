<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/Logo.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/onest-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/montserrat-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>EZSauce — Curated resources for developers & designers</title>
    <meta
      name="description"
      content="EZSauce is a curated collection of tools, design resources, templates, and learning material to help you grow as a developer and designer."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#F1F0EE"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#18181B"
      media="(prefers-color-scheme: dark)"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="EZSauce" />
    <meta
      property="og:description"
      content="A curated collection of resources to help you grow as a developer and designer."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EZSauce" />
    <meta
      name="twitter:description"
      content="A curated collection of resources to help you grow as a developer and designer."
    />
    <meta name="twitter:image" content="/og.jpg" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* localStorage can throw in private mode — fall back to light. */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        EZSauce needs JavaScript to filter and display the resource collection.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
